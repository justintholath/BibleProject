<script>

// This is the "Engine" that fetches the script
function loadBookScript(version, book_name) {
    return new Promise((resolve, reject) => {
        let script = document.createElement('script');
        // Ensure this path matches your folder structure exactly
        script.src = `data/${version}/${book_name}.js`;

        script.onload = () => {
            console.log(`Successfully loaded: ${book_name}.js`);
            resolve();
        };

        script.onerror = () => {
            console.error(`Offline or file missing: ${script.src}`);
            reject("Offline Error");
        };

        document.head.appendChild(script);
    });
}

// This handles the logic of checking the cache first
async function showVerse(version, book_name, chapter) {
    const book_id = `${version}_${book_name}`;
    console.log("showVerse:" + book_id)

    // 1. If not in memory, download the script and wait
    if (!bible_data_cache[book_id]) {
        try {
            await loadBookScript(version, book_name);
        } catch (e) {
            throw "Offline Error";
        }
    }

    // 2. Access the array that the script just registered
    try {
        return bible_data_cache[book_id][chapter - 1];
    } catch (e) {
        return "Verse not found.";
    }
}


// The function your table-builder calls
async function chap_fetch(version, b_no, c_no) {
    // We use 'await' here so it doesn't return a [object Promise]
    let result = await showVerse(version, fetch_name(b_no), c_no);
    return result;
};

async function pop_chap(sumV, b_no, c_no) {
    // 1. Create an array of promises (don't use 'await' yet)
    web_chap = []; bsb_chap = []; kjv_chap = []; ylt_chap = []; lxx_chap = []; nte_chap = []; xrf_chap = [];
    let promises = [];

    // We push the function calls into the array so they all start immediately
    const web_book_id = "web_" + fetch_name(b_no);
    if (sumV.includes("web")){web_chap = bible_data_cache[web_book_id][c_no - 1]};
    if (sumV.includes("bsb")) promises.push(chap_fetch("bsb", b_no, c_no).then(data => bsb_chap = data));
    if (sumV.includes("kjv")) promises.push(chap_fetch("kjv", b_no, c_no).then(data => kjv_chap = data));
    if (sumV.includes("ylt")) promises.push(chap_fetch("ylt", b_no, c_no).then(data => ylt_chap = data));
    if (sumV.includes("lxx") && b_no <= 39) promises.push(chap_fetch("lxx", b_no, c_no).then(data => lxx_chap = data));

    if (sumV.includes("nte")) {
        promises.push(chap_fetch("nte", b_no, c_no).then(data => nte_chap = data));
        promises.push(chap_fetch("xrf", b_no, c_no).then(data => xrf_chap = data));
    };

    // 2. Now wait for ALL of them to finish at once
    try {
        // Run all your fetches
        // If ANY of them fail due to being offline, it will jump to the catch block
        await Promise.all(promises);
    } catch (error) {
        // This only runs ONCE, even if 5 versions failed
        alert("Connection lost. Some versions haven't been saved to your device yet. Try the WEB version.");
    };
};
